{% extends 'layout/base.html' %}
{% block content %}
<div class="col-sm-9 padding-right">
  <div class="blog-post-area">
    <h2 class="title text-center">Add product</h2>

    <form id="productForm" method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <input type="text" name="name" placeholder="Name" class="form-control">
      <p class="text-danger" id="error-name"></p>

      <input type="number" step="0.01" name="price" placeholder="Price" class="form-control">
      <p class="text-danger" id="error-price"></p>

      <select name="id_category" class="form-control">
        <option value="">Please choose category</option>
        {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
      </select>
      <p class="text-danger" id="error-id_category"></p>

      <select name="id_brand" class="form-control">
        <option value="">Please choose brand</option>
        {% for b in brands %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}
      </select>
      <p class="text-danger" id="error-id_brand"></p>

      <select name="status" id="status" class="form-control">
        <option value="0">New</option>
        <option value="1">Sale</option>
      </select>

      <div id="sale-box" style="display:none;">
        <input type="number" name="sale" value="0" class="form-control"> %
      </div>

      <input type="text" name="company" placeholder="Company profile" class="form-control">

      <input type="file" name="images" id="images" multiple>
      <p class="text-danger" id="error-images"></p>

      <textarea name="detail" placeholder="Detail" class="form-control"></textarea>

      <button type="submit" class="btn btn-default">Signup</button>
    </form>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
  $(function () {
  $("#status").change(function () {
    $("#sale-box").toggle($(this).val() === "1");
  });

  $("#productForm").submit(function (e) {
    e.preventDefault();

    const formData = new FormData(this);

    $.ajax({
      url: "{% url 'add_product_ajax' %}",
      type: "POST",
      data: formData,
      processData: false,
      contentType: false,
      success: function (data) {
        window.location.href = "{% url 'my_product' %}";
      },
      error: function (xhr) {
        const errors = xhr.responseJSON.errors || {};
        $(".text-danger").text("");
        $.each(errors, function (key, msg) {
          $("#error-" + key).text(msg);
        });
      }
    });
  });
});
</script>
{% endblock %}
